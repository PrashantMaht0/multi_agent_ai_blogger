# App container only. Ollama runs on the host, Postgres is your remote Supabase instance.
#   docker compose up --build
#
# Prerequisites on the host:
#   1. ollama serve is running, with the models named in .env already pulled
#   2. OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env (localhost is the
#      container itself, so the default would fail)
#   3. token.json exists and is already authorized - the Google OAuth desktop flow opens
#      a browser and cannot complete inside a container. Run auth_blogger.py on the host first.

services:
  dashboard:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Overrides whatever .env says. Inside a container "localhost" is the container
      # itself, but that same value is what a host-side `python app.py` needs - so .env
      # keeps localhost and the override lives here. Do not move this back into .env.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      # Pre-authorized Google credentials, read-only. Never baked into the image.
      - ./token.json:/app/token.json:ro
      - ./credentials.json:/app/credentials.json:ro
    extra_hosts:
      # Lets the container reach the host's Ollama on Linux; a no-op on Docker Desktop
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Measured at 162 MiB idle - the models run on the host, not in here. The cap keeps a
    # runaway container from starving Ollama, which needs ~8 GB resident for gemma4:12b.
    # On a 16 GB machine also shrink the Docker Desktop VM (Settings > Resources) to ~3 GB:
    # an 8 GB VM plus a loaded model leaves nothing, and the VM's OOM killer takes the
    # container out with exit code 137.
    mem_limit: 2g

networks:
  default:
    # Supabase's direct-connection host (db.<ref>.supabase.co) resolves to an AAAA record
    # only. Docker's default bridge is IPv4-only, so without this the checkpointer fails
    # with "Network is unreachable" and the dashboard never starts.
    enable_ipv6: true
