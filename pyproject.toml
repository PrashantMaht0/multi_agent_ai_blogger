[tool.poetry]
name = "ai-blogger-multi-agent"
version = "0.1.0"
description = "A multi-agent automated blogging pipeline using LangGraph and MCP."
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# --- 1. Core Frameworks (Updated to 1.x series) ---
langgraph = "^1.2.11"
langchain = "^1.3.15"
langchain-core = "^1.5.5"
langchain-community = "^0.4.2"
langchain-ollama = "^1.1.0"
langchain-google-genai = "^4.3.4"

# --- 2. Model Context Protocol (MCP) ---
mcp = "^1.24.0" 
fastmcp = "^3.4.7"
langchain-mcp-adapters = "^0.3.2" 

# --- 3. Database & Memory (Supabase / Postgres) ---
langgraph-checkpoint-postgres = "^3.1.2"
psycopg = {extras = ["binary", "pool"], version = "^3.2.0"}
supabase = "^2.31.0" 

# --- 4. Google Blogger API ---
google-api-python-client = "^2.137.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"

# --- 5. Tool Dependencies & Utils ---
tavily-python = "^0.7.27"
python-dotenv = "^1.2.2"
gradio = "^6.24.0"
pyyaml = "^6.0.1"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
deepeval = "^4.1.8" 
langsmith = "^0.11.0" 

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Makes `src` importable however pytest is invoked (bare `pytest` as well as `python -m pytest`)
pythonpath = ["."]